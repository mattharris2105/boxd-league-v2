name: Sync film metadata (TMDB + RT)

on:
  schedule:
    - cron: '0 8 * * 1,4'   # Mon & Thu 08:00 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-fetch even for films that already have tmdb_id / rt'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Sync metadata
        env:
          SUPABASE_URL: https://yxluqkfanhzktinayvex.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          ARGS="--commit"
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then ARGS="$ARGS --refresh"; fi
          node scripts/sync-metadata.mjs $ARGS
