name: Refresh Data Thistle token

on:
  schedule:
    - cron: '0 6 * * 0'   # Sundays 06:00 UTC — well inside the 30-day access-token life
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh even if the access token is still fresh'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Refresh token
        env:
          SUPABASE_URL: https://yxluqkfanhzktinayvex.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--commit"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/refresh-datathistle.mjs $ARGS
