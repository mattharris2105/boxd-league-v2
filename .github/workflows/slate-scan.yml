name: Weekly slate scan

# Diffs the forward theatrical calendar against the films table and queues any
# new films / missing projections into the `film_suggestions` table as
# 'pending'. Writes NOTHING to `films` — the commissioner approves each one from
# the in-app Commissioner -> Suggestions tab.

on:
  schedule:
    - cron: '17 7 * * 0'   # Sun 07:17 UTC
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Look-ahead window in weeks'
        type: string
        default: '16'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Scan the calendar and queue suggestions
        env:
          SUPABASE_URL: https://yxluqkfanhzktinayvex.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/slate-scan.mjs --weeks "${{ github.event.inputs.weeks || '16' }}"
      - name: Research opening estimates (no-op if ANTHROPIC_API_KEY unset)
        env:
          SUPABASE_URL: https://yxluqkfanhzktinayvex.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/enrich-suggestions.mjs
