name: Weekly slate scan

# Diffs the forward theatrical calendar against the films table and opens a PR
# with a proposal file (proposals/slate-<date>.md). Writes NOTHING to the
# database — a human reviews the PR, fills in the est_m column, and merges.

on:
  schedule:
    - cron: '17 7 * * 0'   # Sun 07:17 UTC
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Look-ahead window in weeks'
        type: string
        default: '16'

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Scan the calendar
        env:
          SUPABASE_URL: https://yxluqkfanhzktinayvex.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/slate-scan.mjs --weeks "${{ github.event.inputs.weeks || '16' }}"
      - name: Open / update the proposal PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: slate-scan
          title: 'Weekly slate proposal'
          commit-message: 'chore: weekly slate scan proposal'
          body: |
            Auto-generated by `scripts/slate-scan.mjs`. Nothing here has been
            written to the database.

            **To action:** open the `proposals/slate-<date>.md` file, replace each
            `_?_` with an opening-weekend estimate ($M) — sanity-checked against
            the listed comps — confirm the new-film rows, then follow the
            "How to apply" steps at the bottom of that file. Close this PR
            without merging if there is nothing to add this week.
          add-paths: proposals/
